<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>DOM snapshot — transaction-states</title></head>
<body class="bes">
<span class="bes-badge bes-badge--draft" data-bes-state="draft" data-bes-bound-state="1"><svg class="ic glyph" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2.6 9.4l.5-2 5-5 1.5 1.5-5 5-2 .5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"></path></svg>Not sent yet</span>
<span class="bes-badge bes-badge--review" data-bes-state="review" data-bes-bound-state="1"><svg class="ic glyph" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2.4 6S3.9 3.2 6 3.2 9.6 6 9.6 6 8.1 8.8 6 8.8 2.4 6 2.4 6z" stroke="currentColor" stroke-width="1.3"></path><circle cx="6" cy="6" r="1.15" stroke="currentColor" stroke-width="1.1"></circle></svg>In review</span>
<span class="bes-badge bes-badge--authentication" data-bes-state="authentication" data-bes-bound-state="1"><svg class="ic glyph" viewBox="0 0 12 12" fill="none" aria-hidden="true"><rect x="2.4" y="5.2" width="7.2" height="5" rx="1" stroke="currentColor" stroke-width="1.3"></rect><path d="M4.2 5.2V3.9a1.8 1.8 0 013.6 0v1.3" stroke="currentColor" stroke-width="1.3"></path></svg>Awaiting authentication</span>
<span class="bes-badge bes-badge--processing" data-bes-state="processing" data-bes-bound-state="1"><svg class="ic glyph" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M1.6 6h6.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path><path d="M6.2 3.6L8.9 6l-2.7 2.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M10.4 3.4v5.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>Processing</span>
<span class="bes-badge bes-badge--pending" data-bes-state="pending" data-bes-bound-state="1"><svg class="ic glyph" viewBox="0 0 12 12" fill="none" aria-hidden="true"><circle cx="6" cy="6" r="4.6" stroke="currentColor" stroke-width="1.4"></circle><path d="M6 3.4V6l1.8 1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path></svg>Pending</span>
<span class="bes-badge bes-badge--completed" data-bes-state="completed" data-bes-bound-state="1"><svg class="ic glyph" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2.5 6.4L5 8.9l4.5-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>Completed</span>
<span class="bes-badge bes-badge--failed" data-bes-state="failed" data-bes-bound-state="1"><svg class="ic glyph" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3.2 3.2l5.6 5.6M8.8 3.2L3.2 8.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>Failed</span>
<span class="bes-badge bes-badge--unknown" data-bes-state="unknown" data-bes-bound-state="1"><svg class="ic glyph" viewBox="0 0 12 12" fill="none" aria-hidden="true"><circle cx="6" cy="6" r="4.6" stroke="currentColor" stroke-width="1.4"></circle><path d="M4.7 4.7a1.35 1.35 0 112 1.15V7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path><path d="M6.7 8.9h-.02" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>Checking status</span>
<span class="bes-badge bes-badge--blocked" data-bes-state="blocked" data-bes-bound-state="1"><svg class="ic glyph" viewBox="0 0 12 12" fill="none" aria-hidden="true"><circle cx="6" cy="6" r="4.6" stroke="currentColor" stroke-width="1.4"></circle><path d="M4.9 4.3v3.4M7.1 4.3v3.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path></svg>Additional checks required</span>
<span class="bes-badge bes-badge--reversed" data-bes-state="reversed" data-bes-bound-state="1"><svg class="ic glyph" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M9.4 8.6A3.4 3.4 0 006 3.2H2.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path><path d="M4.4 1.4L2.4 3.2l2 1.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>Reversed</span>
<span class="bes-badge bes-badge--refunded" data-bes-state="refunded" data-bes-bound-state="1"><svg class="ic glyph" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M9.4 8.6A3.4 3.4 0 006 3.2H2.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path><path d="M4.4 1.4L2.4 3.2l2 1.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path><path d="M7.6 9.8h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path></svg>Refunded</span>
<span class="bes-badge bes-badge--disputed" data-bes-state="disputed" data-bes-bound-state="1"><svg class="ic glyph" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3.2 10.2V2.2m0 .6h5.4l-1.2 2 1.2 2H3.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path></svg>Disputed</span>
<span class="bes-badge bes-badge--cancelled" data-bes-state="cancelled" data-bes-bound-state="1"><svg class="ic glyph" viewBox="0 0 12 12" fill="none" aria-hidden="true"><circle cx="6" cy="6" r="4.6" stroke="currentColor" stroke-width="1.4"></circle><path d="M3.2 8.8l5.6-5.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path></svg>Cancelled</span><div class="bes-result bes-result--unknown" data-bes-state="unknown" data-bes-bound-result="1">
       <div class="ic"><svg class="ic glyph" viewBox="0 0 12 12" fill="none" aria-hidden="true"><circle cx="6" cy="6" r="4.6" stroke="currentColor" stroke-width="1.4"></circle><path d="M4.7 4.7a1.35 1.35 0 112 1.15V7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path><path d="M6.7 8.9h-.02" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg></div><h3>Checking status</h3><p class="money-state">Your money is safe — we'll confirm shortly</p>
       
       <button class="bes-btn bes-btn--secondary" id="u-support">Contact support</button>
     </div>
     <div class="bes-result bes-result--failed" data-bes-state="failed" data-bes-bound-result="1">
       <div class="ic"><svg class="ic glyph" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3.2 3.2l5.6 5.6M8.8 3.2L3.2 8.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg></div><h3>Failed</h3><p class="money-state">No money was deducted</p>
       <button class="bes-btn bes-btn--primary" data-bes-retry="" id="f-retry">Try again</button>
     </div>
</body></html>
